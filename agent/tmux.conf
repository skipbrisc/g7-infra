# /usr/local/lib/g7-agent/tmux.conf on G7. Source: agent/tmux.conf in g7-infra.
# Settings of the tmux server that holds the agent jobs (g7-agent-tmux.service).
set -g default-shell /bin/bash
set -g default-terminal tmux-256color
set -g history-limit 100000
set -g remain-on-exit off
set -g mouse on
set -g status-left "[G7 agent #S] "
set -g status-left-length 60
set -g status-right "detach: Ctrl-b d"
setw -g aggressive-resize on
