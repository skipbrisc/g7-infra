# /etc/systemd/system/jenkins-agent.service.d/priority.conf on G7. Source: g7-infra.
# Builds yield to everything else on G7. On 2026-11-27 two TaxGlasses-CI builds each stalled the
# MemeSniper path recorder (4.2 s and 8.1 s) while they ran on all 12 threads at normal priority.
# AllowedCPUs: builds see 6 of G7's 12 threads, so test runners start about 5 workers, not 11.
# After g7-apply, restart by hand when no build is running: systemctl restart jenkins-agent
[Service]
CPUWeight=20
IOWeight=20
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7
AllowedCPUs=6-11
