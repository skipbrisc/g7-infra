# /etc/systemd/system/restic-rest-server.service.d/g7.conf on G7. Source: g7/pc-backup/ in g7-infra.
# The backup disk (/mnt/data) is NTFS mounted for root only (uid=0, umask=077), so the Debian
# unit's own user cannot write there. The server runs as root instead, but with no capabilities
# at all and a sandbox that shows it nothing of /mnt/data except PC-backups (G7's own backup
# repository stays out of sight), and nothing of /srv, /opt, /var/lib, /root, /home or the
# secrets in /etc. It can write only to /mnt/data/PC-backups.
[Unit]
RequiresMountsFor=/mnt/data
Wants=network-online.target
After=network-online.target

[Service]
User=root
Group=root
PrivateUsers=no
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
TemporaryFileSystem=/mnt/data:ro
BindPaths=/mnt/data/PC-backups
InaccessiblePaths=-/srv -/opt -/var/lib -/var/backups -/var/log -/usr/local/sbin -/etc/shadow -/etc/gshadow -/etc/sudoers -/etc/sudoers.d -/etc/ssh -/etc/wireguard -/etc/taxglasses -/etc/memesniper-live -/etc/g7-agent
Restart=always
RestartSec=10
