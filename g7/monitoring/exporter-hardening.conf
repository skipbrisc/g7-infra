# Drop-in for prometheus-node-exporter and prometheus-process-exporter on G7.
# Source: g7-infra g7/monitoring/exporter-hardening.conf (g7-apply). Both only read /proc,
# /sys and (node) the systemd bus, so they get the same limits Debian gives Prometheus.
[Service]
NoNewPrivileges=true
ProtectSystem=full
ProtectHome=read-only
PrivateTmp=true
