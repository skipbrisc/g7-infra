# Grafana on G7: dashboards for the metrics Prometheus keeps. Installed at /opt/grafana
# (g7/monitoring/README.md).
#
# Host networking, as Uptime Kuma: it reads Prometheus on 127.0.0.1:9090, which a container on a
# Docker bridge cannot reach. The web page listens on 192.168.0.6:3000 only (at home directly;
# away, WireGuard routes 192.168.0.6). Nothing from G7 is mounted except its own read-only
# provisioning folder and its admin password file; no Docker socket.
services:
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    network_mode: host
    user: "472"
    environment:
      TZ: America/Los_Angeles
      GF_SERVER_HTTP_ADDR: 192.168.0.6
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: http://192.168.0.6:3000/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./admin_password:/run/secrets/admin_password:ro
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

volumes:
  grafana_data:
