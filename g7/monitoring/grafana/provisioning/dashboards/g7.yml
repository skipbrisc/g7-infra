# Dashboards kept in Git. Source: g7-infra g7/monitoring/grafana/provisioning (g7-apply).
# Edits made in the browser are refused; change the JSON in Git instead.
apiVersion: 1
providers:
  - name: g7-infra
    folder: G7
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
