# Grafana data source on G7. Source: g7-infra g7/monitoring/grafana/provisioning (g7-apply).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: g7-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
