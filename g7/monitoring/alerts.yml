# /etc/prometheus/rules/g7.yml on G7. Source: g7-infra g7/monitoring/alerts.yml (g7-apply).
# Alert rules. Prometheus checks them every 30 seconds; Alertmanager sends what fires to ntfy
# topic g7 (alertmanager.yml). Each fires only after its condition has held for its "for".
# Check before restarting: promtool check rules /etc/prometheus/rules/g7.yml
# MemeSniper's units are left out: MemeSniper's own checks report on it (memesniper-deploy).
groups:
  - name: g7
    rules:
      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{job="node",mountpoint=~"/|/mnt/data"}
            / node_filesystem_size_bytes{job="node",mountpoint=~"/|/mnt/data"} < 0.10
        for: 15m
        labels: {severity: high}
        annotations:
          summary: '{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free'

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes{job="node"} < 500 * 1024 * 1024
        for: 10m
        labels: {severity: high}
        annotations:
          summary: 'Only {{ $value | humanize1024 }}B of memory available for 10 minutes'

      - alert: HeavySwapping
        expr: rate(node_vmstat_pswpout{job="node"}[5m]) > 500
        for: 15m
        labels: {severity: default}
        annotations:
          summary: 'Swapping out {{ $value | printf "%.0f" }} pages a second for 15 minutes: memory is short'

      - alert: ServiceFailed
        expr: node_systemd_unit_state{job="node",state="failed",name!~"memesniper.*"} == 1
        for: 5m
        labels: {severity: high}
        annotations:
          summary: '{{ $labels.name }} has failed (systemctl status {{ $labels.name }})'

      - alert: MonitoringTargetDown
        expr: up{job=~"node|process"} == 0
        for: 5m
        labels: {severity: default}
        annotations:
          summary: 'Prometheus cannot read {{ $labels.job }} ({{ $labels.instance }}); its charts and alerts are blind'
